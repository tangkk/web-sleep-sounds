<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="实时生成白噪声与自然声，独立混音、音色调节、睡眠定时和跨设备同步。">
<link rel="icon" href="./favicon.ico" sizes="any"><link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>Sleep Sounds · 睡眠声景</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff;color:#111;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#fff;color:#111}button,select,input{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #111;outline-offset:3px}
.wrap{max-width:890px;padding:36px 20px 80px;margin:auto}header{display:flex;align-items:center;gap:15px;margin-bottom:31px}.moon{font-size:35px;width:60px;height:60px;border-radius:19px;background:#f3f3f3;display:grid;place-items:center}h1{font-size:clamp(26px,5vw,35px);letter-spacing:-.7px;margin:0 0 5px}.sub,.hint{color:#555;font-size:14px}.sub{margin:0}
.panel{border:1px solid #ddd;background:#fff;border-radius:22px;box-shadow:0 5px 24px #00000008}.player{padding:27px;margin-bottom:22px}.player-top{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.eyebrow{color:#555;font-size:13px;margin:0 0 8px}#status{font-size:19px;font-weight:650;margin:0}#play{min-width:130px;padding:15px 21px;border:0;background:#111;color:#fff;font-weight:750;border-radius:15px}#play:hover{background:#333}#play:disabled{opacity:.6;cursor:wait}.master{display:grid;grid-template-columns:90px 1fr 45px;align-items:center;gap:13px;margin-top:29px}input[type=range]{width:100%;accent-color:#111;cursor:pointer}output{color:#333;font-size:13px;font-variant-numeric:tabular-nums;text-align:right}h2{font-size:20px;margin:31px 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.sound{padding:19px;transition:background .2s,border-color .2s}.sound.active{border-color:#111;background:#f6f6f6}.sound-head{display:flex;justify-content:space-between;gap:10px;align-items:start}.sound-title{display:flex;align-items:center;gap:11px}.symbol{font-size:25px;width:43px;height:43px;border-radius:13px;display:grid;place-items:center;background:#f1f1f1;color:#111;font-family:Arial,Helvetica,sans-serif;font-weight:500;line-height:1;flex:none}.name{font-weight:700;font-size:16px;margin-bottom:4px}.detail{color:#555;font-size:12px;line-height:1.5}.toggle{flex:none;border:1px solid #aaa;background:#fff;color:#111;border-radius:100px;min-width:56px;padding:7px 10px;font-size:12px}.active .toggle{background:#111;color:#fff;border-color:#111;font-weight:700}.control{display:grid;grid-template-columns:75px minmax(0,1fr) 38px;align-items:center;gap:9px;margin-top:17px}.control label{font-size:12px;color:#444;white-space:nowrap}.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:end;padding:21px}.field{display:flex;flex-direction:column;gap:9px;color:#333;font-size:13px;flex:1;min-width:170px}select,.sync-code{width:100%;border:1px solid #aaa;background:#fff;color:#111;padding:12px;border-radius:11px}.secondary{border:1px solid #aaa;border-radius:11px;padding:12px 16px;background:#fff;color:#111}.secondary:hover{background:#f3f3f3}.timer-status{color:#333;min-height:19px;margin:12px 0 0;font-size:13px;font-variant-numeric:tabular-nums}.sync-panel{padding:21px}.sync-panel h2{margin:0 0 8px}.sync-panel p{color:#555;font-size:13px;line-height:1.6}.sync-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}.sync-status{min-height:20px;color:#555;font-size:13px;margin-top:12px}footer{color:#555;font-size:12px;line-height:1.8;margin-top:27px}
@media(max-width:580px){.wrap{padding:27px 15px 65px}.grid{grid-template-columns:1fr}.player{padding:21px}.master{grid-template-columns:64px 1fr 38px;gap:9px}.control{grid-template-columns:70px minmax(0,1fr) 38px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
<main class="wrap">
<header><div class="moon" aria-hidden="true">☾</div><div><h1>Sleep Sounds</h1><p class="sub">属于你的睡眠声景 · ∞ 实时生成</p></div></header>
<section class="panel player" aria-label="播放器"><div class="player-top"><div><p class="eyebrow">NOW PLAYING</p><p id="status" role="status">准备好，今晚睡个好觉</p></div><button id="play" type="button" aria-pressed="false">▶ 开始播放</button></div><div class="master"><label for="master">总音量</label><input id="master" type="range" min="0" max="100" value="30"><output id="master-value" for="master">30%</output></div><p class="timer-status" id="timer-status" aria-live="polite"></p></section>
<h2>选择声音 · 自由混合</h2><div class="grid" id="sounds"></div>
<h2>睡眠设置</h2><section class="panel tools" aria-label="睡眠设置"><label class="field" for="timer">自动关闭（结束前渐弱 30 秒）<select id="timer"><option value="0">不设置</option><option value="15">15 分钟</option><option value="30">30 分钟</option><option value="45">45 分钟</option><option value="60">1 小时</option><option value="90">1.5 小时</option><option value="120">2 小时</option><option value="180">3 小时</option></select></label><button class="secondary" id="reset" type="button">恢复默认混音</button></section>
<h2>设备同步</h2><section class="panel sync-panel" aria-label="设备同步"><p>不同设备输入相同同步码，即可同步每种声音的开关、音量、音色参数、总音量与定时设置。播放状态和倒计时仅保存在本机，不会远程自动播放。</p><label class="field" for="sync-code">同步码<input id="sync-code" class="sync-code" type="text" autocomplete="off" spellcheck="false" placeholder="输入你自己设置的同步码"></label><div class="sync-actions"><button id="sync-save" class="secondary" type="button">保存并同步</button><button id="sync-now" class="secondary" type="button">立即同步</button><button id="sync-off" class="secondary" type="button">关闭此设备同步</button></div><p id="sync-indicator" class="hint">未连接</p><div id="sync-status" class="sync-status" role="status" aria-live="polite"></div><p>同步码相当于访问凭据，请不要公开分享。未连接时设置仍只保存在本机；同步需要联网。</p></section>
<footer>音频由 AudioWorklet 实时生成，无固定循环。首次播放需要点击按钮；建议从低音量开始。部分手机锁屏或省电时可能暂停网页音频。本应用不保证助眠效果。</footer>
</main>
<script src="./ios-background.js?v=1"></script>
<script src="./sleep-engine-v2.js?v=2"></script>
<script src="./sleep-app-v2.js?v=2"></script>
<script src="./sync.js?v=2" defer></script>
</body>
</html>
